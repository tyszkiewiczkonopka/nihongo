<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nihongo Dojo — Vocab</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="apple-mobile-web-app-title" content="Nihongo Dojo" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#F2EDE1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="quiz.css">
  <style>
    .romaji-display {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--ink);
      word-break: break-word;
    }

    .kana-reveal {
      font-family: 'Shippori Mincho', serif;
      font-size: 34px;
      font-weight: 600;
      color: var(--ink);
    }

    .translation-reveal {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      color: var(--ink-soft);
    }

    .progress-label { text-align: center; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="container quiz-container">
      <header class="quiz-header">
        <a class="brand-home" href="./"><img class="brand-logo" src="favicon.png" alt="" /> Nihongo Dojo</a>
        <a class="hint-link" href="grammar" target="_blank" rel="noopener" aria-label="Grammar reference" title="Grammar reference">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 5a2 2 0 0 1 2-2h6v16H6a2 2 0 0 0-2 2V5Z" />
            <path d="M20 5a2 2 0 0 0-2-2h-6v16h6a2 2 0 0 1 2 2V5Z" />
          </svg>
        </a>
      </header>

      <div class="unit-label progress-label" id="progressLabel"></div>

      <div class="card">
        <div class="romaji-display" id="romajiDisplay">—</div>
        <div class="sub-hint" id="revealHint"></div>
      </div>

      <button class="btn-primary check-btn" id="actionBtn" onclick="onAction()">Roll the dice</button>
    </div>
  </div>

  <script>
    const VOCAB = [
    { k: "せんせい", r: "sensei", p: "nauczyciel" },
    { k: "ともだち", r: "tomodachi", p: "znajomy" },
    { k: "たくさん", r: "takusan", p: "dużo" },
    { k: "すこし", r: "sukoshi", p: "trochę" },
    { k: "すくない", r: "sukunai", p: "mało" },
    { k: "いらっしゃいませ", r: "irasshaimase", p: "Witam" },
    { k: "かいもの", r: "kaimono", p: "zakupy" },
    { k: "おんがく", r: "ongaku", p: "muzyka" },
    { k: "いっしょに", r: "isshoni", p: "razem" },
    { k: "ごはん", r: "gohan", p: "posiłek" },
    { k: "あさごはん", r: "asagohan", p: "śniadanie" },
    { k: "ひるごはん", r: "hirugohan", p: "obiad" },
    { k: "ばんごはん", r: "bangohan", p: "kolacja" },
    { k: "にく", r: "niku", p: "mięso" },
    { k: "やさい", r: "yasai", p: "warzywa" },
    { k: "さかな", r: "sakana", p: "ryba" },
    { k: "さけ", r: "sake", p: "alkohol" },
    { k: "おちゃ", r: "ocha", p: "herbata" },
    { k: "とんかつ", r: "tonkatsu", p: "kotlet wieprzowy" },
    { k: "しんぶん", r: "shinbun", p: "gazeta" },
    { k: "かさ", r: "kasa", p: "parasol" },
    { k: "かばん", r: "kaban", p: "torebka" },
    { k: "ざっし", r: "zasshi", p: "czasopismo" },
    { k: "じしょ", r: "jisho", p: "słownik" },
    { k: "じてんしゃ", r: "jitensha", p: "rower" },
    { k: "ばしょ", r: "basho", p: "miejsce" },
    { k: "いえ", r: "ie", p: "dom (budynek)" },
    { k: "うち", r: "uchi", p: "dom (rodzinny)" },
    { k: "おてあらい", r: "otearai", p: "łazienka" },
    { k: "おてら", r: "otera", p: "świątynia" },
    { k: "きっさてん", r: "kissaten", p: "kawiarnia" },
    { k: "ぎんこう", r: "ginkou", p: "bank" },
    { k: "こうえん", r: "kouen", p: "park" },
    { k: "バスてい", r: "basutei", p: "przystanek autobusowy" },
    { k: "びょういん", r: "byouin", p: "szpital" },
    { k: "ほんや", r: "honya", p: "księgarnia" },
    { k: "まち", r: "machi", p: "miasto" },
    { k: "ゆうびんきょく", r: "yuubinkyoku", p: "poczta" },
    { k: "としょかん", r: "toshokan", p: "biblioteka" },
    { k: "びじゅつかん", r: "bijutsukan", p: "galeria sztuki" },
    { k: "どうし", r: "doushi", p: "czasowniki" },
    { k: "おきる", r: "okiru", p: "budzić się" },
    { k: "たべる", r: "taberu", p: "jeść" },
    { k: "ねる", r: "neru", p: "spać" },
    { k: "みる", r: "miru", p: "patrzeć/ oglądać" },
    { k: "いく", r: "iku", p: "iść" },
    { k: "かえる", r: "kaeru", p: "wracać" },
    { k: "きく", r: "kiku", p: "słuchać/ pytać" },
    { k: "まつ", r: "matsu", p: "czekać" },
    { k: "のむ", r: "nomu", p: "pić" },
    { k: "はなす", r: "hanasu", p: "rozmawiać / mówić" },
    { k: "よむ", r: "yomu", p: "czytać" },
    { k: "かう", r: "kau", p: "kupować" },
    { k: "する", r: "suru", p: "robić" },
    { k: "くる", r: "kuru", p: "przychodzić" },
    { k: "べんきょうする", r: "benkyou suru", p: "uczyć się" },
    { k: "あさ", r: "asa", p: "rano" },
    { k: "ひる", r: "hiru", p: "południe" },
    { k: "よる", r: "yoru", p: "noc" },
    { k: "きょう", r: "kyou", p: "dziś" },
    { k: "きのう", r: "kinou", p: "wczoraj" },
    { k: "あした", r: "ashita", p: "jutro" },
    { k: "しゅうまつ", r: "shuumatsu", p: "weekend" },
    { k: "こんばん", r: "konban", p: "dziś wieczór" },
    { k: "まいにち", r: "mainichi", p: "codziennie" },
    { k: "まいあさ", r: "maiasa", p: "każdego ranka" },
    { k: "まいばん", r: "maiban", p: "każdego wieczora" },
    { k: "まいしゅう", r: "maishuu", p: "co tydzień" },
    { k: "こんしゅう", r: "konshuu", p: "ten tydzień" },
    { k: "いつも", r: "itsumo", p: "zawsze" },
    { k: "けいようし", r: "keiyoushi", p: "przymiotniki" },
    { k: "おいしい", r: "oishii", p: "pyszny" },
    { k: "まずい", r: "mazui", p: "obrzydliwy" },
    { k: "たかい", r: "takai", p: "drogi / wysoki" },
    { k: "やすい", r: "yasui", p: "tani" },
    { k: "かぞく", r: "kazoku", p: "rodzina" },
    { k: "おかあさん", r: "okaasan", p: "matka" },
    { k: "おとうさん", r: "otousan", p: "ojciec" },
    { k: "おにいさん", r: "oniisan", p: "starszy brat" },
    { k: "おねえさん", r: "oneesan", p: "starsza siostra" },
    { k: "いもうと", r: "imouto", p: "młodsza siostra" },
    { k: "おとうと", r: "otouto", p: "młodszy brat" },
    { k: "おじいさん", r: "ojiisan", p: "dziadek" },
    { k: "おばあさん", r: "obaasan", p: "babcia" },
    ];

    let pool = [];
    let current = null;
    let state = 'idle'; // idle | rolled | revealed

    function shuffle(array) {
      const a = [...array];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function refillPool() {
      pool = shuffle(VOCAB);
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function render() {
      const display = document.getElementById('romajiDisplay');
      const hint = document.getElementById('revealHint');
      const btn = document.getElementById('actionBtn');
      const progress = document.getElementById('progressLabel');

      if (state === 'idle') {
        display.textContent = '—';
        hint.textContent = '';
        btn.textContent = 'Roll the dice';
      } else if (state === 'rolled') {
        display.textContent = current.r;
        hint.textContent = '';
        btn.textContent = 'Reveal';
      } else {
        display.textContent = current.r;
        hint.innerHTML = '<span class="kana-reveal">' + escapeHtml(current.k) + '</span><br>'
          + '<span class="translation-reveal">' + escapeHtml(current.p) + '</span>';
        btn.textContent = 'Next word';
      }

      progress.textContent = 'UNIT 2 · ' + pool.length + ' OF ' + VOCAB.length + ' LEFT';
    }

    function rollDice() {
      if (pool.length === 0) refillPool();
      current = pool.pop();
      state = 'rolled';
      render();
    }

    function onAction() {
      if (state === 'idle' || state === 'revealed') {
        rollDice();
      } else {
        state = 'revealed';
        render();
      }
    }

    refillPool();
    render();
  </script>
</body>
</html>
